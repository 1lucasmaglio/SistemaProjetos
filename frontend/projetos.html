
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Sistema de Projetos</title>

    <link rel="stylesheet" href="/frontend/css/style.css">
</head>

<body>

    <!-- Cabeçalho -->
    <header>
        <h1>Sistema de Projetos</h1>
        <p>Cadastro e gerenciamento de projetos</p>
    </header>

    <main>

        <!-- Cadastro de projetos -->
        <section id="cadastro">

            <h2>Cadastrar projeto</h2>

            <p class="descricao">
                Preencha os campos abaixo para cadastrar um projeto.
            </p>

            <form id="formProjeto">

                <label for="nome">Nome:</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Digite o nome do projeto"
                    required
                >

                <label for="descricao">Descrição:</label>
                <textarea
                    id="descricao"
                    placeholder="Descreva o projeto"
                    required
                ></textarea>

                <label for="categoria">Categoria:</label>
                <select id="categoria" required>
                    <option value="Web">Web</option>
                    <option value="Software">Software</option>
                    <option value="Mobile">Mobile</option>
                    <option value="Outro">Outro</option>
                </select>

                <label for="status">Status:</label>
                <select id="status" required>
                    <option value="Planejado">Planejado</option>
                    <option value="Em desenvolvimento">
                        Em desenvolvimento
                    </option>
                    <option value="Concluído">Concluído</option>
                </select>

                <button type="submit">
                    Cadastrar projeto
                </button>

            </form>

        </section>

        <!-- Projetos cadastrados -->
        <section id="projetos">

            <h2>Projetos cadastrados</h2>

            <p class="descricao">
                Consulte os projetos registrados no sistema.
            </p>

            <p id="mensagem"></p>

            <div id="listaProjetos"></div>

        </section>

    </main>

    <!-- Rodapé -->
    <footer>
        <p>Sistema de Projetos</p>
        <p>Projeto acadêmico de Análise e Desenvolvimento de Sistemas</p>
    </footer>

    <script src="/frontend/js/script.js"></script>

</body>

</html>
