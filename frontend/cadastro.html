<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cadastro | Sistema de Projetos</title>

    <link
      rel="stylesheet"
      href="https://bootswatch.com/5/slate/bootstrap.min.css"
    />
    <link rel="stylesheet" href="/frontend/css/style.css" />
  </head>

  <body>
    <main class="pagina-login">
      <section class="painel-login">
        <div class="marca">
          <img
            src="/frontend/img/logoTitle.png"
            alt="PanBoo - Sistema de Projetos"
          />
        </div>

        <h1>Criar conta</h1>

        <p class="descricao-login">
          Cadastre-se para começar a organizar seus projetos.
        </p>

        <form id="formCadastro">
          <div class="campo">
            <label for="nome">Nome</label>
            <input
              type="text"
              id="nome"
              class="form-control"
              placeholder="Digite seu nome"
              required
            />
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              class="form-control"
              placeholder="Digite seu e-mail"
              required
            />
          </div>

          <div class="campo">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              class="form-control"
              placeholder="Digite sua senha"
              required
            />
          </div>

          <p id="mensagemCadastro" role="status"></p>

          <button type="submit" class="btn btn-primary botao-login">
            Cadastrar
          </button>
        </form>

        <p class="link-login">
          Já tem uma conta? <a href="/frontend/login.html">Entrar</a>
        </p>
      </section>
    </main>

    <script src="/frontend/js/cadastro.js"></script>
  </body>
</html>
